name: Release

# Publishing is deliberately manual: it runs only when a maintainer pushes a v* tag, never on a
# merge. PyPI trusted publishing must be configured for this repository first — a human step that
# cannot be automated from here (plans/20260725_1317-v0.1.md, I15).
#
# Until that human step happens, the PyPI upload is *skipped rather than attempted*, gated on the
# repository variable PUBLISH_TO_PYPI. Everything before it still runs on every tag — version/tag
# agreement, build, and the isolated wheel smoke test — so a tag is fully validated even when
# nothing is uploaded, and pushing one never produces a red run for a reason the maintainer
# already knows about. To start publishing: configure trusted publishing on PyPI, then set the
# variable (`gh variable set PUBLISH_TO_PYPI --body true`). Nothing else here changes.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # The pre-publish check below resolves fresh and starts a server, so this job's runtime is a
    # third party's to change too. `timeout 300` bounds the handshake; this bounds the job.
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write        # trusted publishing; no API token is stored anywhere
      contents: write        # the GitHub release below, and nothing else in this job
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Refuse a tag that disagrees with the package version
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --frozen python -c 'import pinakes; print(pinakes.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pinakes $version" >&2
            exit 1
          fi

      - run: uv build

      - name: Smoke-test the wheel before it leaves the building
        run: |
          set -e
          uv run --isolated --no-project --with dist/*.whl pnk --version
          uv run --isolated --no-project --with dist/*.whl pnk init /tmp/release-smoke
          test -f /tmp/release-smoke/pinakes.toml

      # **This is the step that had to exist, and did not.** `--isolated --no-project --with
      # dist/*.whl` resolves fresh, so the smoke test above ran against whatever the index offered
      # on the day — and it asked `pnk --version` and `pnk init`, neither of which touches `mcp`.
      # `mcp` 2.0.0 removed `mcp.server.fastmcp`; `serve.py` imports it at module scope; every
      # release from the first to 0.27.1 was published with `pnk serve` dead, and this job was
      # green for all of them.
      #
      # It belongs **here** and not only in `ci.yml`, because a dependency's major arrives with no
      # commit in this repository: `ci.yml` runs on push and pull_request, so `main` can be green
      # on Monday, the break can publish on Wednesday, and a tag on Thursday would carry it to
      # PyPI — which never takes a version back. `uv publish` is the irreversible step and nothing
      # able to fail may sit behind it, so both checks run in front of it, where a failure costs a
      # deleted tag and nothing else.
      - name: The wheel it is about to publish can actually serve
        run: |
          set -e
          # Exactly one wheel — an `if`, not `test A && test B`, which under `set -e` lets a
          # failing first command through (measured 20260822).
          set -- dist/*.whl
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one built wheel in dist/, found: $*"
            exit 1
          fi
          wheel="$PWD/$1"
          uv run --isolated --no-project --with "$wheel" python tools/wheel_import_gate.py \
            --require pinakes.serve --min-modules 50 \
            --allow-missing pinakes.extract.pdfium:pypdfium2
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            > "$RUNNER_TEMP/mcp-session.jsonl"
          # `set +e` around the capture, because `out=$(...)` under `set -e` aborts the step
          # *before* `echo "$out"` — a red release job with no reason printed, which is the
          # "verify the artifact, never the run status" class this project keeps recording.
          set +e
          out=$(timeout 300 uv run --isolated --no-project --with "$wheel" \
            pnk serve /tmp/release-smoke < "$RUNNER_TEMP/mcp-session.jsonl" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::the wheel about to be published exited $code starting the MCP server"
            exit 1
          fi
          echo "$out" | grep -q '"serverInfo"' \
            || { echo "::error::the wheel about to be published cannot start the MCP server"; exit 1; }
          echo "$out" | grep -q 'pinakes_search' \
            || { echo "::error::it answered initialize and registered no tools"; exit 1; }

      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: uv publish

      - name: Explain why nothing was published
        if: vars.PUBLISH_TO_PYPI != 'true'
        run: |
          echo "::notice::PUBLISH_TO_PYPI is not 'true' — the wheel was built and smoke-tested but not uploaded."
          echo "Configure PyPI trusted publishing, then: gh variable set PUBLISH_TO_PYPI --body true"

      # **After the upload, never before.** PyPI refuses a version twice, so the upload is the
      # irreversible step and nothing may be able to fail in front of it. A failure here leaves a
      # published package with no GitHub release — recoverable by hand in one command, which is
      # exactly what happened for the twenty-five releases before this step existed.
      #
      # **This step did not exist until 0.22.0, and its absence was misdiagnosed six times.**
      # `docs/STATUS.md` recorded "the workflow failed to create the release" at every release from
      # 0.20.1 on; `git log -S` shows no workflow in this repository's history ever contained a
      # release-creating step, and `docs/RELEASING.md` step 8 had always said to create it by hand.
      # The job's `success` was honest — it did everything it was asked to. Checking harder could
      # never have distinguished an absent feature from a broken one; reading the workflow did.
      - name: Create the GitHub release
        if: vars.PUBLISH_TO_PYPI == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # `--verify-tag` refuses to invent a release for a tag that is not pushed, and
          # `--notes-from-tag` uses the annotation the maintainer already wrote rather than
          # generating a diff nobody reviewed.
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
