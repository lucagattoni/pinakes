name: injection-audit

# **The one question a macOS checkout cannot answer about itself.**
#
# `tools/vacuous_injection_audit.py` neutralises each `monkeypatch.setattr(Path|os|paths, …)` in
# the suite and re-runs the test that owns it. A test that still passes is one of three things, and
# only the first is a defect: its assertions never depended on the injected condition; **the real
# environment produces that condition anyway**, so the fake is redundant *here* and may be
# load-bearing elsewhere; or the probe mis-attributed the site.
#
# The middle case is why this job exists. `tests/test_cli_link.py:617` injects `ENAMETOOLONG`, and
# a real 300-character filename raises it for real wherever `NAME_MAX` is 255 — so on a developer's
# macOS checkout that fake decides nothing, while the test's own comment records the opposite on
# CI. **Redundant on one platform, load-bearing on another, and not rulable from either alone.**
# Every developer machine here is macOS; this is the missing half.
#
# **It is not folded into `ci.yml`, and the reason is mechanical rather than aesthetic.** `on:` is
# declared once per workflow file and applies to every job in it, so a job living in `ci.yml`
# cannot have its own trigger or its own path filter — it would pay its cost on every unrelated
# push and PR forever. Filed as row 42 of `plans/20260901_1148-clear-the-user-facing-list.md`.

on:
  workflow_dispatch:
    inputs:
      python:
        description: "Interpreter to audit under (default: the declared floor)"
        default: "3.13"
        type: string

  # **The two events want different filters, because they answer to different failure modes.**
  #
  # A pull request is gated narrowly — the tests that hold the injections, the tool, and this file.
  # It therefore never fires on an ordinary code PR, so nobody acquires a reason to disable it.
  #
  # `main` additionally watches `src/pinakes/**`, and that is the tool's *own* stated motivating
  # failure: "the day the production code stops calling the faked name, the test goes on passing
  # while covering nothing." The faked names are reached through `link.py`, `linkscan.py`,
  # `sync.py`, `sidecar.py`, `doctor.py` and more — **not** `paths.py` alone. A filter naming only
  # `paths.py` stays silent for exactly the change the audit exists to catch: not a false green, a
  # false silence. Production drift is a standing property of `main` rather than something urgent
  # inside one PR, which is the same trade `minimum-python` already makes by running on push only.
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "src/pinakes/**"
      - "tools/vacuous_injection_audit.py"
      - ".github/workflows/injection-audit.yml"
  pull_request:
    paths:
      - "tests/**"
      - "tools/vacuous_injection_audit.py"
      - ".github/workflows/injection-audit.yml"

concurrency:
  group: injection-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ inputs.python || '3.13' }} and dependencies
        # `[light]` only, per row 42: no injection site sits in a `[pdf]` or `[claude]` code path.
        #
        # **One leg on the floor, not a 3.13/3.14 matrix, and that is a measurement rather than a
        # preference.** Run on macOS 20260904 at 10:01 and 10:03 UTC the verdict set was
        # byte-identical on 3.14.7 and 3.13.15 — 15 sites, 1 vacuous, 0 unruled, the same site both
        # times. The mechanism agrees: the 3.13/3.14 split lives in `Path.is_file()` and
        # `Path.exists()`, and `src/pinakes/paths.py` exists so production no longer calls them —
        # none of the fifteen neutralised paths reaches either. A second leg would "cost a job to
        # prove a combination with no mechanism behind it", which is `ci.yml`'s own sentence
        # refusing a `3.13 x [claude]` cross-product for the identical reason. An earlier version of
        # this file kept the matrix as insurance; that inverted the repo's settled idiom and turned
        # a measured-inert axis into a standing cost nobody would re-examine.
        #
        # The floor is the one to run: 3.14 only duplicates the runner default, while 3.13 is what
        # `pyproject.toml` promises and what went unexecuted until 20260903. The other interpreter
        # stays **a question you can ask** — `workflow_dispatch` takes one — rather than a cost paid
        # on every run. If a verdict ever does split across the two, this comment is wrong and the
        # matrix is the fix.
        run: uv sync --frozen --python ${{ inputs.python || '3.13' }} --extra light

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/demo-kb/pinakes.toml') }}
          restore-keys: hf-

      - name: Confirm the interpreter is the one this run asked for
        # `minimum-python`'s guard, for its reason: `uv sync --python X` is a *request*, and a run
        # that silently used another version would be this job reporting a verdict about an
        # interpreter it never used.
        run: |
          set -e
          uv run --frozen python -c "import sys; want='${{ inputs.python || '3.13' }}'; got='.'.join(map(str, sys.version_info[:2])); assert got == want, (got, want, sys.version); print(sys.version)"

      - name: Audit every injection site
        # **No wrapper gate, deliberately.** The tool's exit status *is* the assertion: non-zero on
        # the unruled set (`UNSTABLE`, `INCONCLUSIVE`, no caller found), non-zero on a collapsed
        # site list (`--min-sites`, default 10), non-zero when the environment moved mid-run, and
        # **zero on a `VACUOUS` row** — a finding for a person to read, for the same reason
        # `mutate.py` exits 0 on a survivor. Grepping its stdout here would be a second copy of a
        # contract the tool already owns, free to drift out of step with it.
        #
        # Run bare. `… | tee log` would make this step read `tee`'s status, which is the failure
        # `CLAUDE.md` names and which landed two red commits on 20260904.
        run: python3 tools/vacuous_injection_audit.py --runs 2
