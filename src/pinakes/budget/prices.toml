# Ships as package data (I6a) — read at runtime through `importlib.resources`, never a
# repo-relative path, so an installed wheel sees exactly what a source checkout does.
#
# Every price is a *string*, not a bare TOML number: this file is entirely project-controlled
# (never user-authored, unlike pinakes.toml), so there is no reason to let a TOML float sit
# between the literal below and the `Decimal` this project does all money arithmetic in.
# `Decimal("5.00")` is exact; `Decimal(5.00)` is not (verified directly, docs/RETROSPECTIVES.md).
#
# usd_per_eur carries the same as_of as the model prices below: every EUR figure this project
# computes depends on it, and a rate with its own, different staleness would make "the prices are
# fresh" a claim about only half of what an estimate actually uses.
#
# The rate is the ECB euro foreign-exchange reference rate, read from api.frankfurter.dev (which
# republishes the ECB series). Named here because docs/RELEASING.md's re-verification step asks for
# "a named FX source, on the day you stamp", and an unnamed source is not re-checkable by the next
# release. It sat at the seed value 1.08 from 20260728 to 20260831 22:52 while as_of moved once
# beneath it -- the exact falsification that step warns about.
#
# The ECB fixing date is not always as_of's date, and the difference is recorded rather than
# implied. The ECB publishes around 16:00 CET, so a release cut in the morning necessarily carries
# the previous business day's fixing; letting as_of imply the fixing it read is the quiet half of
# the same falsification. 0.32.1 was stamped on 20260903 09:32 and carries the 2026-09-02 fixing,
# the newest published at that moment. The value it replaces, 1.159, was the 2026-09-01 fixing and
# was itself one release old -- which is the step working: the rate moved 0.10% in a day, and the
# only reason anyone knows that is that it was re-read rather than carried forward.
#
# 0.32.2 re-read the same source at 20260903 12:53 and the API returned the 2026-09-02 fixing again,
# at the same 1.1578: the ECB had not published 20260903 yet, which is the ordinary outcome for the
# second release of one day. The stamp moved because the check was performed; the rate did not,
# because it had not moved.
#
# 0.32.3, at 20260903 14:31, is the third release of the same day and the first to catch the day's own
# fixing: the ECB had published 2026-09-03 by then, at 1.1615, so the rate moves 1.1578 -> 1.1615,
# up 0.32%. Three releases, three re-reads, two different values -- which is the measurement this
# step exists to take rather than the ceremony it looks like from one release away.
#
# 0.32.4, at 20260903 16:37, re-read the same source and got the 2026-09-03 fixing again at 1.1615: the ECB
# publishes once a day, so a fourth release on the same day necessarily re-reads the same value.
# Only as_of moves. Four re-reads, two values.
#
# 0.32.5, at 20260904 08:48, is the next morning and the ECB had not yet published 2026-09-04 -- it posts
# around 16:00 CET -- so the newest fixing is still 2026-09-03 at 1.1615. Fifth re-read, still two
# values. A morning release necessarily carries the previous business day; that is the step working,
# not the step being skipped.
as_of = "20260904 08:48"
usd_per_eur = "1.1615"

# Measured against the live API on 20260729 03:17 with claude-opus-5, over the synthetic corpus
# (docs/MEASUREMENT-RUN.md). Recorded here rather than only in a retrospective because the next
# person to touch `estimate.py`'s constants needs the numbers, not the story:
#
#   input   ~1,574 tokens per page, intercept ~571      (7 count_tokens calls, 1/2/5-page slices)
#   output  ~215 tokens per page                        (430 tokens for a 2-page slice)
#   the reservation over-reserved 11.5x on the first live call
#
# `measured_on` is the corpus, not a date alone: these are synthetic documents, and a real scan
# at full resolution is precisely what they do not represent.
measured_on = "tests/pdf-corpus (synthetic), 20260729 03:17, claude-opus-5"

[models.claude-opus-5]
input_per_mtok_usd = "5.00"
output_per_mtok_usd = "25.00"
