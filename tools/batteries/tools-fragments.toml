# ────────────────────────────────────────────────────────────────────────────────────────────────
# a retrospective fragment carries its own `##` heading, stamped from its own filename
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# **`document_problems` cannot see either of these, and that is the mechanism rather than an
# oversight.** A fragment with no heading is not spliced malformed — it is *absorbed*: `render`
# joins bodies with a blank line, so its prose lands under whichever fragment sorts before it and
# reads as that incident's. The assembled document is correct markdown making a false claim, so a
# checker reading the result is reading the evidence after it was destroyed. Hence `check`, which
# reads the fragments going in.
#
# The stamp is a *copy* of the filename's prefix, because a second reading of the clock is a second
# chance to be wrong — 20260826, three headings typed from memory in one morning, out by 1 minute,
# 2 minutes and 3 hours 30 minutes.
#
# **The corpus cannot substitute for these rows.** `retro.d/` holds only *unreleased* fragments —
# the rest were spliced into `docs/RETROSPECTIVES.md` and deleted at each release — so the live
# directory was 4 files when this was built and all 4 already passed. The one live counter-example
# anywhere was a *fixture*, in `test_apply_is_one_step_or_none_across_every_stream`.

