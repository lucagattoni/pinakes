# Mutation battery — `tools/fragments.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-fragments.toml
#
# Every row is a way the front-matter refusal could be wrong while still printing a green run.
# **A row is a claim about one assertion, never about the file** (`tools/batteries/README.md`).
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

# ────────────────────────────────────────────────────────────────────────────────────────────────
# 0.28.0 · a fragment that opens with front matter is refused before `--apply` can splice it
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Mutation battery for the two gates added 20260822.
#
# Mutant 1 is the control: a known-catchable change run first, because a battery with no kills is a
# broken harness rather than a clean bill.

[[mutant]]
name = "the front-matter fence is never detected"
file = "tools/fragments.py"
old = '''        return line.rstrip() == "---"'''
new = '''        return False'''
kills = "tests/test_fragments.py::test_a_fragment_that_opens_with_front_matter_is_refused"

[[mutant]]
name = "DISCRIMINATING — the check becomes 'a fence anywhere', refusing a horizontal rule"
