# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260826 · one id, two paths — the regression the adversarial pass caught
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# The first version of this increment guarded the disagreement branch and left the ordinary one
# alone, so a sidecar MOVED from one document onto another produced `RefreshMetadata(X, a.md)`
# beside `Adopt(X, b.md)`. The same-path loop trusted the index row because nothing beside `a.md`
