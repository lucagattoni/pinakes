# Mutation battery — `src/pinakes/pairing.py`, spanning `src/pinakes/sync.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-pairing.toml
#
# **Two files, because the guarantee spans two.** `pairing` decides whether an id is ending or
# moving; `sync` applies that decision against a UNIQUE constraint on `documents.path`. Neither
# half is wrong on its own in any of the rows below — every one of them is a plan and an execution
# that disagree, which is the shape that loses a document without raising anything.
#
# `pairing.py`'s own docstring calls it "the logic that silently corrupts a KB when it is wrong",
# and `sync.py` was named in `tools/batteries/README.md` as the highest-churn file in the
# repository with no battery at all. This is that gap, closed for one guarantee and not for the
# file.
#
# Every row is a way the code could be wrong while `pnk sync` still prints a confident, plausible
# summary and exits 0. **A row is a claim about one assertion, never about the file.**
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 8

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260825 · a plan must never retire an id it also adopts
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# The shipped defect this increment closed. When a sidecar's id disagreed with the row at its path,
# `pair()` retired the row and adopted the sidecar's id — unconditionally. With two documents
# renamed past each other both halves fire, and the plan carries a `SoftDelete` and an `Adopt` for
# the same id: the outcome then depends on which is applied last, and both orders are wrong.
#
# Rows 1 and 2 are the two directions of that guard. Row 3 restricts the lookahead to sidecars
# sitting beside a file the walk actually found.
#
# **Rows 2 and 3 both SURVIVED their first selector, and the reason is worth more than the rows.**
# Neither mutant changes *which* actions a plan contains — when the same-path branch stops emitting
# the `SoftDelete`, the vanished-path loop re-emits one further down the list. The census is
# identical; only the ORDER moves, from `[SoftDelete, Adopt]` to `[Adopt, Adopt-collides]`. Every
# assertion pointed at `describe()` therefore passed, and row 3 survived **the entire suite —
# 2165 passed, 0 failed**, measured with the mutant applied at the commit where it was observed
# rather than inferred from the three files that cover this code. `documents.path` is UNIQUE, so the order is the entire behaviour: an `Adopt` applied while
# the row it replaces is still active raises `IntegrityError`. Both now name a test that asserts
# the order rather than the counts.

[[mutant]]
name = "THE SHIPPED DEFECT — the row is retired unconditionally, so a name swap retires the id it just adopted"
file = "src/pinakes/pairing.py"
old = '''            if document.id not in claimed_by_id:
                actions.append(SoftDelete(doc_id=document.id, path=path))
                handled_ids.add(document.id)'''
new = '''            actions.append(SoftDelete(doc_id=document.id, path=path))
            handled_ids.add(document.id)'''
kills = "tests/test_pairing.py::test_a_name_swap_never_retires_an_id_the_same_plan_adopts"

[[mutant]]
name = "the guard is inverted, so an ordinary in-place id change stops retiring the row it replaces"
