# Mutation battery — `src/pinakes/pairing.py`, spanning `src/pinakes/sync.py`,
# `src/pinakes/store.py`, `src/pinakes/paths.py` and `src/pinakes/doctor.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-pairing.toml
#
# **Three files, because the guarantees span three.** `pairing` decides whether an id is ending or
# moving; `sync` applies that decision against a UNIQUE constraint on `documents.path`. Neither
# half is wrong on its own in the id rows below — every one of them is a plan and an execution
# that disagree, which is the shape that loses a document without raising anything.
#
# **`store.py` joined on 20260903, with S7.** One row reaches it, and it is there because the
# property genuinely lives there: `sync` clears a path's `failures` before re-attempting it, and
# the failure paths then roll back, which discards that clear — so the replace has to happen in
# `store.record_failure` as well, and nothing in `sync.py` can be mutated to prove it. A row
# anchored in the wrong file to keep a battery tidy would be a claim about an assertion that does
# not hold it.
#
# **`paths.py` joined on 20260903, with the interpreter fix.** Two rows reach it, and they are
# there for the same reason `store.py` is: the property lives in that file. `is_regular_file` and
# `resolves` began as private helpers in `sync.py`, and the adversarial review then found the
# identical crash in `doctor.py` and `linkscan.py` — which could not import a `_name` out of
# `sync`. Moving them to `paths.py` is what makes one fix cover three callers, and it moved these
# two anchors with them. `--check-anchors` caught that; nothing else would have, because a row
# whose anchor matches nothing reads SURVIVED rather than broken.
#
# `pairing.py`'s own docstring calls it "the logic that silently corrupts a KB when it is wrong",
# and `sync.py` was named in `tools/batteries/README.md` as the highest-churn file in the
# repository with no battery at all. This is that gap, closed for one guarantee and not for the
# file.
#
# Every row is a way the code could be wrong while `pnk sync` still prints a confident, plausible
# summary and exits 0. **A row is a claim about one assertion, never about the file.**
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

