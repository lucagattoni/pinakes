# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260825 · the retiring DELETE, and why its scope is the load-bearing half
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Row 4 is the collision itself: a retired row keeps its `path`, `documents.path` is UNIQUE, and
# `ON CONFLICT (id)` is structurally unable to see a conflict on the path.
#
# **Row 5 is the one worth the battery.** A previous attempt at this fix shipped the same DELETE
# without the `state = 'deleted'` scope and the whole suite stayed green — the review that caught it
# could not find a reachable case and left the question open. It is reachable: a rename cycle whose
# second half fails to index. Every action commits on its own, so the unscoped DELETE destroys a
# live row before knowing the replacement will land. Measured with the scope removed: `pnk sync`
# exits **0**, the document sits on disk with its sidecar and has **no row at all** — which is worse
# than the defect this increment closed, because a row that does not exist cannot be retired, so
# `doctor`'s own check for this cannot see it either.

[[mutant]]
name = "the retiring DELETE is gone, so a changed sidecar id collides with the corpse of the row it replaces"
file = "src/pinakes/sync.py"
old = '''    _retire_row_holding(connection, path=path, doc_id=doc_id)
    connection.execute(
        "INSERT INTO documents (id, path, content_hash, sidecar_hash, mtime, source_type, title, "'''
new = '''    connection.execute(
        "INSERT INTO documents (id, path, content_hash, sidecar_hash, mtime, source_type, title, "'''
kills = "tests/test_sync.py::test_a_retired_row_no_longer_blocks_a_new_id_at_its_own_path"

