# Mutation battery — `tools/release_order_gate.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-release_order_gate.toml
#
# Every row is a way this gate could be wrong while still printing a green run; the test named
# beside it is the one assertion that catches that. **A row is a claim about one assertion, never
# about the gate** — a battery of forty-one kills does not say the file is correct, it says these
# forty-one breakages are each noticed by a named test.
#
# Sections are the increments that wrote them, oldest release first. **An increment that touches
# this file again appends a section here rather than starting a file of its own** — one battery
# per target is what stops two increments leaving two snapshots that disagree
# (`tools/batteries/README.md`).
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`, so there is
# one less thing in it that can rot.

mutants = 45

