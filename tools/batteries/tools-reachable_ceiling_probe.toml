# Mutation battery — `tools/reachable_ceiling_probe.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-reachable_ceiling_probe.toml
#
# **Scoped to `--questions` and nothing else.** The probe is a large file and this battery is the
# first one it has had; it covers the flag that landed with it, not the tool. Read the directory's
# README on why that is a starting point rather than a coverage claim — a reader who greps this
# file and finds every anchor resolving learns that four named defects are caught, and nothing
# about the other thousand lines.
#
# What makes this flag worth a battery at all: **every mutant below is a way the probe keeps
# running, exits 0 and prints a plausible artifact.** There is no crash to notice. The tool's whole
# job is to produce a number that a `schema_version` bump is decided on, so a run that measures one
# question set while labelling it another is the worst shape a defect can take here — and three of
# the four rows are *partial implementations*, which is what a hurried version of this change
# actually looks like, not an imagined one.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 4

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260831 · `--questions`, a golden set that is not the KB's own
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Mutant 1 is the control: the fix reverted whole, run first, because a battery with no kills is a
# broken harness rather than a clean bill.

[[mutant]]
name = "CONTROL — the flag is parsed and then ignored, and the KB's own set is measured as always"
file = "tools/reachable_ceiling_probe.py"
# The state of the file before this increment. argparse still accepts `--questions`, `--help`
# still advertises it, and the value is silently dropped — which is the failure the flag exists to
# end, restored exactly.
old = '''        questions_path = args.questions or (root / "eval" / "questions.yaml")'''
new = '''        questions_path = root / "eval" / "questions.yaml"'''
kills = "tests/test_eval.py::test_the_probe_measures_the_golden_set_the_flag_names"

[[mutant]]
name = "the flagged set is read, but the refusal names the default it displaced"
file = "tools/reachable_ceiling_probe.py"
# `check_measurable` takes `source=` separately from the questions themselves, so this is one
# keystroke from correct and survives every assertion about the *successful* path. It fails in the
# only direction that costs anything: the operator is sent to fix `<kb>/eval/questions.yaml`,
# finds it healthy, and the file that actually refused is never opened.
old = '''                source=questions_path,'''
new = '''                source=root / "eval" / "questions.yaml",'''
kills = "tests/test_eval.py::test_a_refusal_names_the_golden_set_the_flag_named"

[[mutant]]
name = "the recorded golden-set path is no longer resolved, so two relative sets record as one"
file = "tools/reachable_ceiling_probe.py"
# The same defect `kb_root` already carries a test for, on the field beside it. Two golden sets
# both reached as `./kept.yaml` from two directories produce artifacts identical in the field that
# is supposed to tell them apart. Invisible to any test whose fixture path is already absolute —
# which is every other test here, since `tmp_path` is absolute and resolved.
old = '''            golden_set_path = str(questions_path.resolve())'''
new = '''            golden_set_path = str(questions_path)'''
kills = "tests/test_eval.py::test_a_relative_questions_path_is_recorded_resolved"

[[mutant]]
name = "`--questions` is folded into the `--kb`/`--fake` exclusive group"
file = "tools/reachable_ceiling_probe.py"
# The plausible future "tidy-up", and it is wrong for a reason worth pinning: `--kb` is refused
# alongside `--fake` because `--fake` would have to *discard* it and report one corpus's numbers
# under another's name. A golden set is honoured whichever corpus is underneath, so there is
# nothing to discard — the exclusion would remove a working combination to prevent a collision
# that cannot happen. argparse exits 2 before anything is measured.
old = '''    parser.add_argument(
        "--questions",'''
new = '''    corpus.add_argument(
        "--questions",'''
kills = "tests/test_eval.py::test_the_probe_measures_the_golden_set_the_flag_names"
