# ────────────────────────────────────────────────────────
# unreleased, 20261019 · `.gitignore` — the other file this increment's tests hold
# ────────────────────────────────────────────────────────
#
# Claude Code writes `**/.claude/worktrees/` into `.git/info/exclude` on a machine that has run it,
# so the rule is invisible here whether or not the repository carries it. The test therefore asks
# the repository's own `.gitignore` in an empty repository; these two rows prove it can fail.

[[mutant]]
name = ".gitignore no longer excludes .claude/worktrees/, which a clone without Claude Code's own line would commit"
file = ".gitignore"
old = '''.claude/worktrees/
.claude/settings.local.json'''
new = '''.claude/worktrees-x/
.claude/settings.local.json'''
kills = "tests/test_review_workflow.py::test_claude_worktrees_are_ignored_and_the_workflows_directory_is_not"

[[mutant]]
