[[mutant]]
name = "the lenses are launched in reverse, so the runtime lens starts last"
file = ".claude/workflows/adversarial-review.js"
# This also misaligns `runs[i]` with `LENSES[i]`, so other tests die too. The named one is the
# assertion that exists *for* the order; the others dying is the same defect seen from further off.
old = '''  LENSES,
  lens => agent(lensPrompt(lens)'''
new = '''  [...LENSES].reverse(),
  lens => agent(lensPrompt(lens)'''
kills = "tests/test_review_workflow.py::test_slow_lenses_are_launched_first"

