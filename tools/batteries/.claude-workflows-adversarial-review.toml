# Mutation battery — `.claude/workflows/adversarial-review.js`.
#
#     python3 tools/mutate.py tools/batteries/.claude-workflows-adversarial-review.toml
#
# The filename begins with a dot because the naming rule (`tools/batteries/README.md`) says path,
# `/` → `-`, extension dropped — so `ls` and `tools/batteries/*.toml` do not show it. Name it
# explicitly, as above.
#
# Every row is a way this review could report a pass it did not earn; the test named beside it is
# the one assertion that catches that. **A row is a claim about one assertion, never about the
# script.** The script's real fan-out cannot run in `./check.sh`; the stub hooks in
# `tests/review_workflow_harness.mjs` stand in for the runtime, so these rows prove the *control
# flow* is held — which lens starts first, what is counted before what is filtered, which model
# each call names — and nothing about what a real lens finds.
#
# The target is JavaScript, so `tools/mutate.py` does not compile the mutant before running it
# (its `.py`-only check) and an edit that breaks the syntax would read as a kill. Each mutant
# below was chosen to stay valid JavaScript, and the named test is the one that has to die.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 22

# ────────────────────────────────────────────────────────
# unreleased, 20261019 · a review that says whether anyone looked
# ────────────────────────────────────────────────────────
#
# Mutant 1 is the control and it is the original defect: collect the fan-out with `.filter(Boolean)`
# and a dead lens vanishes from the count. 17 of 19 agents died on a session limit once and the run
# returned {"raised":0}. A battery with no kills is a broken harness rather than a clean bill, and
# this is the known-catchable one to run first.

[[mutant]]
name = "CONTROL — the fan-out is collected with .filter(Boolean), so a lens that died is not counted as dead"
file = ".claude/workflows/adversarial-review.js"
# Replaces the whole expression, so no dead record is ever synthesised. The classify() count still
# sees fewer lenses than expected, which is why the verdict stays PARTIAL — and why the test must
# assert the *list* of dead lenses and not only the verdict: a count that disagrees with its own
# list is the shape of the original bug.
old = '''LENSES.map((lens, i) => runs[i] || { lens: lens.key, dead: true, notRun: [], raised: [], verdicts: [] })'''
new = '''runs.filter(Boolean)'''
kills = "tests/test_review_workflow.py::test_a_lens_that_throws_is_a_dead_lens"

[[mutant]]
name = "a lens that returned null is not listed among the dead"
file = ".claude/workflows/adversarial-review.js"
old = '''const lensesDied = lensRecords.filter(r => r.dead).map(r => r.lens)'''
new = '''const lensesDied = lensRecords.filter(r => false).map(r => r.lens)'''
kills = "tests/test_review_workflow.py::test_a_dead_lens_is_partial_not_clean"

[[mutant]]
name = "a pass in which no lens returned reads CLEAN instead of VACUOUS"
file = ".claude/workflows/adversarial-review.js"
# VACUOUS is not a smaller CLEAN: it says nobody looked. Folding it into CLEAN is the 20260825 clean
# bill from a fan-out whose agents were all dead.
old = '''if (c.lensesReturned === 0) return 'VACUOUS''''
new = '''if (c.lensesReturned === 0) return 'CLEAN''''
kills = "tests/test_review_workflow.py::test_every_lens_dead_is_vacuous_and_not_clean"

[[mutant]]
name = "a probe that could not be run no longer lowers the verdict"
file = ".claude/workflows/adversarial-review.js"
old = '''if (c.notRun > 0) return 'PARTIAL''''
new = '''if (c.notRun > 99) return 'PARTIAL''''
kills = "tests/test_review_workflow.py::test_an_unrun_probe_is_partial_even_though_every_lens_returned"

[[mutant]]
name = "a finding with no refuter no longer lowers the verdict"
file = ".claude/workflows/adversarial-review.js"
old = '''if (c.refutersReturned < c.refutersExpected) return 'PARTIAL''''
new = '''if (false) return 'PARTIAL''''
kills = "tests/test_review_workflow.py::test_a_finding_whose_refuter_died_is_unrefuted_not_dropped"

[[mutant]]
name = "survivors with no ruling no longer lower the verdict"
file = ".claude/workflows/adversarial-review.js"
old = '''if (c.judgeNeeded && !c.judgeReturned) return 'PARTIAL''''
new = '''if (false) return 'PARTIAL''''
kills = "tests/test_review_workflow.py::test_a_dead_judge_leaves_survivors_unjudged_and_nothing_confirmed"

[[mutant]]
name = "a dead lens no longer lowers the verdict, so findings from the survivors read as the whole story"
file = ".claude/workflows/adversarial-review.js"
# The precedence the docstring names: a pass with findings and a dead lens is PARTIAL, not FINDINGS.
old = '''if (c.lensesReturned < c.lensesExpected) return 'PARTIAL''''
new = '''if (false) return 'PARTIAL''''
kills = "tests/test_review_workflow.py::test_confirmed_findings_never_hide_a_dead_lens"

# ────────────────────────────────────────────────────────
# unreleased, 20261019 · what is launched, in what order, on which model
