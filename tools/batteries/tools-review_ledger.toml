[[mutant]]
name = "WAS A BUG — normalisation anchors on the package directory, so src/pinakes/x.py becomes x.py"
file = "tools/review_ledger.py"
# The shipped defect, restored: taking the *first* path component after any marker rather than
# anchoring on a top-level directory. Every `src/pinakes/*.py` then collides with every same-named
# file in a reviewer's scratch tree, and the overlap this tool exists to measure reads high.
old = '''    if best > 0:
        return path[best + 1 :]'''
new = '''    if best > 0:
        return path.rsplit("/", 1)[-1]'''
kills = "tests/test_review_ledger.py::test_a_package_path_keeps_its_directories"

[[mutant]]
name = "WAS A BUG — the last top-level name wins, and the committed corpora leave the map entirely"
file = "tools/review_ledger.py"
# The original `rfind`, restored. `tests/demo-kb/docs/x.md` becomes `docs/x.md`, which is not a
# tracked file, so the screen below drops it — 102 tracked paths are shaped that way, and 28 of the
# corpus's 49,000 read targets actually hit it. This row exists because the battery's first run
# left it SURVIVED against a test asserting the wrong property, and answering the survivor is what
# found the defect.
old = '''        found = path.find("/" + marker)
        if found != -1 and (best == -1 or found < best):'''
new = '''        found = path.rfind("/" + marker)
        if found != -1 and (best == -1 or found > best):'''
kills = "tests/test_review_ledger.py::test_a_corpus_path_that_nests_a_top_level_name_keeps_all_of_it"

