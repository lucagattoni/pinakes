# Mutation battery — `tools/review_ledger.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-review_ledger.toml
#
# Every row is a way this tool could be wrong while printing a plausible brief and exiting 0 — and
# that is the whole risk here, because **this tool's output is read by a later review pass as
# established ground**. A gate that fails wrongly is noticed within the hour. A carried-forward map
# that is quietly wrong is inherited, and the pass that inherits it is the one that was supposed to
# be checking.
#
# Six of the nine rows below are defects that were **actually in this file** — four found when it
# first ran against the real corpus, two more by its own adversarial pass — with `ruff`, `pyright`
# and every existing test green each time. They are mutants because they were bugs, not because
# they were imagined.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 9

