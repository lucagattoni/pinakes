# Mutation battery — `tools/mutate.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-mutate.toml
#
# The tool mutating itself. It works because the run's own process has already imported its code,
# while every selector spawns a *fresh* interpreter through `tests/test_mutate.py`'s subprocess
# helper — so the tests meet the mutant and the harness driving them does not.
#
# **A row is a claim about one assertion, never about the tool** (`tools/batteries/README.md`).
#
# Not mutated, and named so the absence is not read as an oversight:
#
# * **`sys.stdout.flush()` before the problems are written to stderr.** Nothing pins it. The two
#   streams are captured separately by `subprocess.run(capture_output=True)`, so their interleaving
#   is not observable from a test at all — only from a terminal, which is the thing it is for. A
#   mutant here would report SURVIVED truthfully and say nothing new.
# * **`tests/test_batteries.py`'s own subject is a set of TOML files**, and `mutate.py` refuses a
#   target under `tests/`. Its guards are pinned by the batteries it reads being real, which is the
#   one thing a mutation run cannot arrange.

mutants = 21

