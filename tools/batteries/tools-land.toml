# Mutation battery — `tools/land.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-land.toml
#
# **One subject: the refusal to land a tree no gate certified.** Nothing here mutates the merge,
# the push or the cleanup — those were covered by tests before this battery existed and their
# assertions are unchanged. A reader who finds every anchor resolving has learned about the gate
# guard and nothing else about this script.
#
# The guard exists because two sessions landed over a red gate on 20260904, hours apart, both
# quoting the rule at each other the same day. A convention two informed sessions break in one day
# is one this project replaces with a gate.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 3

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260904 · row 39 — a tree nobody read
# ────────────────────────────────────────────────────────────────────────────────────────────────

[[mutant]]
name = "the guard checks the branch's tree instead of the tree the merge produces"
file = "tools/land.py"
# **The hole the first draft of this guard had, and it is not hypothetical.** `git merge --no-ff`
# combines the branch with a `main` that may have moved, so the result is neither side's tree.
# Measured over the four merges before the guard existed: two of the four differed from their
# branch tip. Keyed to the branch, the guard passes while a tree nobody gated reaches `origin/main`
# — asleep in exactly the case it exists for. Caught in review by the planner, before it shipped.
old = '''    result = git(
        "merge-tree", "--write-tree", DEFAULT_BRANCH, branch, cwd=root, check=False
    ).splitlines()'''
new = '''    result = git("rev-parse", f"{branch}^{{tree}}", cwd=root, check=False).splitlines()'''
kills = "tests/test_land.py::test_certifying_the_branch_alone_is_not_enough_when_the_default_branch_moved"

[[mutant]]
name = "an unreadable merge result is treated as certified rather than left to the merge"
file = "tools/land.py"
# `None` means "the merge would conflict, so there is nothing to certify" — and the merge below
# then fails on its own terms. Returning early on *any* falsy tree turns a lookup failure into a
# pass, which is the difference between "the merge will explain this" and "the guard waved it
# through". The refusal test builds no conflict, so this mutant makes the guard silent for it.
old = '''    tree = merged_tree(root, branch)
    if tree is None:
        return'''
new = '''    tree = merged_tree(root, branch)
    if tree is None or tree:
        return'''
kills = "tests/test_land.py::test_a_branch_no_gate_has_certified_is_refused_and_nothing_moves"

[[mutant]]
name = "the marker directory is per-worktree, so the gate's own marker is never found"
file = "tools/land.py"
# The gate runs in the branch's linked worktree and this refusal runs in the primary checkout.
# `--git-common-dir` is the one path they share; `--git-dir` is not, and it is the more obvious
# spelling of the two. Under it every real landing is refused with "no gate certified this",
# which reads as the guard working rather than as the guard broken.
old = '''    common = Path(git("rev-parse", "--git-common-dir", cwd=root))'''
new = '''    common = Path(git("rev-parse", "--git-dir", cwd=root))'''
kills = "tests/test_land.py::test_landing_moves_the_default_branch_and_pushes"
