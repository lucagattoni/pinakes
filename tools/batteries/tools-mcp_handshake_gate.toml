file = "Makefile"
# `make` hands a recipe line beginning `\t#` to `/bin/sh`, which ignores it and exits 0 — so the
# target succeeds, `make help` still advertises the gate, and nothing anywhere says the tag was
# never checked. Measured as a real failure mode in this repository on 20260822, for `make smoke`.
old = '''	uv run --frozen python3 tools/release_tag_gate.py'''
new = '''	#uv run --frozen python3 tools/release_tag_gate.py'''
kills = "tests/test_release_tag_gate.py::test_make_release_check_runs_the_gate_rather_than_describing_it"

[[mutant]]
name = "one hyphen tells make to ignore the gate's exit status"
file = "Makefile"
# A recipe line beginning `-` has its status discarded. The gate still runs, still prints its
# refusal, and `make release-check` still exits 0 — which is the pre-20260826 behaviour restored
# in one character, with the failure text on screen to make it look like it worked.
old = '''release-check:  ## Gate the annotated tag at HEAD — run it after `git tag -a` and before the push
	uv run --frozen python3 tools/release_tag_gate.py'''
new = '''release-check:  ## Gate the annotated tag at HEAD — run it after `git tag -a` and before the push
	-uv run --frozen python3 tools/release_tag_gate.py'''
kills = "tests/test_release_tag_gate.py::test_make_release_check_runs_the_gate_rather_than_describing_it"

# ------------------------------------------------------------------------------------------------
# unreleased, 20260831 · the identity a served request is answered under (S3)
# ------------------------------------------------------------------------------------------------
#
# **These rows are here because `src/pinakes/serve.py` already had a battery — this one.** A
# `src-pinakes-serve.toml` was written first and refused by
# `tests/test_batteries.py::test_no_file_is_claimed_by_two_batteries`, which is the rule working:
# one file, one place to add to. The battery's name is not its coverage, and this is the second
# time that sentence has had to be learned from the directory listing rather than read in it.
#
# `ServedKb` cached one `sqlite3.Connection` per KB and handed it to whichever thread asked next.
# `serve.py` starts no threads, so the file reads as single-threaded and every test in
# `tests/test_serve.py` encoded that reading — none of them started a thread. The MCP transport
# supplies them: a sync tool runs under `anyio.to_thread.run_sync` on a pooled worker.
#
# **What was measured, because the obvious framing was wrong.** Driven end to end through
# `mcp.call_tool`, six concurrent calls left two answering and four raising `ProgrammingError`,
# while an eleven-second pause reproduced nothing — macOS had already handed the retired worker's
# thread id to its replacement, and `sqlite3` compares ids. The symptom that reproduced every time
# was `close()`, which runs on a thread that opened nothing.
#
# **The row this battery cannot have.** The keying mistake the fix exists to avoid — keying the
# cache by `threading.get_ident()` rather than by the thread object — has no mutant, because no
# test kills it deterministically: a recycled id makes a dead entry look alive and hands a new
# thread a dead one's handle, and whether an id is recycled is the OS's choice, not the test's. It
# is stated here rather than given a `kills` selector it would not honour. It is also not
# hypothetical — it is what the first draft of the rebuild test did, and that test passed against
# the unfixed code.

[[mutant]]
name = "CONTROL — every thread keys off one entry again, which is the shipped design exactly"
file = "src/pinakes/serve.py"
old = '''        current = threading.current_thread()'''
new = '''        current = threading.main_thread()'''
kills = "tests/test_serve.py::test_a_search_from_a_second_thread_answers_instead_of_raising"

[[mutant]]
name = "the handle is opened bound to its own thread, so shutdown cannot close a single one it opened"
file = "src/pinakes/serve.py"
old = '''            opened = store.connect_ro(self.manifest.index_path, owning_thread_only=False)'''
new = '''            opened = store.connect_ro(self.manifest.index_path)'''
kills = "tests/test_serve.py::test_close_reaps_a_handle_opened_on_a_thread_that_has_since_exited"

