# Mutation battery — `tools/mcp_handshake_gate.py`, and the six files that run it.
#
#     python3 tools/mutate.py tools/batteries/tools-mcp_handshake_gate.toml
#
# The guarantee is one thing — *a published wheel still answers `initialize` with Pinakes' own
# name, Pinakes' own version and Pinakes' own tool list* — and it is spread across seven files:
# the gate (8 mutants), `.github/workflows/ci.yml` (9), `.github/workflows/release.yml` (4),
# the `Makefile` (3), `src/pinakes/serve.py` (2), `check.sh` (1) and `pyproject.toml`'s
# dependency floor (1). **The mutants live together because the guarantee does**, and because
# four of them are one idea in three files — a gate is only a gate when its exit status is what
# the next command reads: `| tee` and `|| true` in ci.yml, `set +e` in release.yml, and a
# command substitution in the Makefile. Split by file, that pattern would be invisible.
#
# `tools/batteries/README.md` says how a battery earns a name and how a file is routed to one:
# a battery is named for its **primary target**, and no file may be claimed by two batteries.
#
# **A row is a claim about one assertion, never about the contract.**
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 35

