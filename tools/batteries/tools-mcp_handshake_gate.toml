# **These two mutate the `Makefile` and belong to a different gate.** `tools/release_tag_gate.py`
# has its own battery, `tools-release_tag_gate.toml`; the `Makefile` does not get a second one,
# because a file belongs to exactly one battery and this is the one that already claims it
# (`tools/batteries/README.md`). They sit here under the idea this battery already carries in
# three other files — *a gate is only a gate when its exit status is what the next command reads*
# — and the target they cover is the one that spent its whole life failing exactly that test:
# `make release-check` was three `echo`s behind a help string promising it verified the tag.

