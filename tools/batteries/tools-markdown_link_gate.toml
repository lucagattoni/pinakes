[[mutant]]
name = "a directory link is rejected — the six false positives a peer's `is_file()` resolver invented"
file = "tools/markdown_link_gate.py"
# The failure mode a `docs/`-only control leg does not exercise, which is the whole reason it is
# here as a mutant rather than a comment.
old = '''        if part not in entries:
            return False
        current = current / part
    return True'''
new = '''        if part not in entries:
            return False
        current = current / part
    return current.is_file()'''
kills = "tests/test_markdown_link_gate.py::test_a_link_to_a_directory_is_accepted"

[[mutant]]
name = "an indented code block is read as prose, so a teaching example becomes a broken link"
file = "tools/markdown_link_gate.py"
# The false positive that did real damage: `retro.d/README.md:37` is a four-space-indented example
# showing fragment authors which anchor form to write. A peer acted on this exact false positive
# and rewrote the example into one teaching the *wrong* form. A false positive gets acted on.
old = '''        if indent >= threshold + 4 and (after_blank or in_indented):'''
new = '''        if False:'''
kills = "tests/test_markdown_link_gate.py::test_a_link_in_an_indented_code_block_is_not_resolved"

[[mutant]]
name = "the list stack goes, so every wrapped bullet is misread as code and stops being checked"
file = "tools/markdown_link_gate.py"
# The false-negative half of the same rule, and the more dangerous direction: a bullet's
# continuation line is indented to the item's content column, so without the stack this gate would
# quietly stop checking most of the prose in a repository that wraps at 100 columns — and report a
# clean run while doing it.
old = '''        threshold = lists[-1] if lists else 0'''
new = '''        threshold = 0'''
kills = "tests/test_markdown_link_gate.py::test_a_wrapped_bullet_continuation_is_still_checked"

[[mutant]]
name = "a spliced-away fragment is read anyway, so the gate dies on every release"
file = "tools/markdown_link_gate.py"
# Not a hypothesis: this crashed against a real release tree. `fragments.py --apply` deletes each
# fragment it splices and `check.sh` runs before the `git add`, so `git ls-files` names a file the
# disk does not have. Found by a peer who had hit the identical bug in their own scanner minutes
# before.
old = '''        if not path.is_file():
            continue
        out.append(path)'''
new = '''        out.append(path)'''
kills = "tests/test_markdown_link_gate.py::test_a_tracked_file_deleted_mid_release_is_skipped_rather_than_crashing"

[[mutant]]
name = "--paths accepts a file that does not exist and dies reading it"
file = "tools/markdown_link_gate.py"
old = '''    missing = [path for path in paths if not path.is_file()]'''
new = '''    missing: list[Path] = []'''
kills = "tests/test_markdown_link_gate.py::test_paths_naming_a_file_that_does_not_exist_is_refused_rather_than_traced"
