# Mutation battery — `.claude/workflows/adversarial-review.js`.
#
#     python3 tools/mutate.py tools/batteries/claude-workflows-adversarial-review.toml
#
# Every row is a way this review could report a pass it did not earn; the test named beside it is
# the one assertion that catches that. **A row is a claim about one assertion, never about the
# script.** The script's real fan-out cannot run in `./check.sh`; the stub hooks in
# `tests/review_workflow_harness.mjs` stand in for the runtime, so these rows prove the *control
# flow* is held - which lens starts first, what is counted before what is filtered, which model
# each call names, what is read back from a reply before it is believed - and nothing about what a
# real lens finds.
#
# The target is JavaScript, so `tools/mutate.py` does not compile the mutant before running it
# (its `.py`-only check) and an edit that breaks the syntax would read as a kill. Each mutant
# below was chosen to stay valid JavaScript, and the named test is the one that has to die.
#
# The first version of this battery had 22 rows and a review pass found that a mutation gutting
# every schema, one removing the guard on the judge call, one removing the sha pattern's anchors,
# and one turning pipeline() into a barrier all survived. They are rows now.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 40

# ────────────────────────────────────────────────────────
# unreleased, 20261019 · a review that says whether anyone looked
# ────────────────────────────────────────────────────────

[[mutant]]
name = "CONTROL — the pipeline's results are collected with .filter(Boolean), so a lens whose stage threw is not counted as dead"
file = ".claude/workflows/adversarial-review.js"
# The original idiom, applied to the fan-out's results: a lens that is missing from the list is not in the dead list either. classify() still sees fewer lenses than expected, which is why the verdict stays PARTIAL - and why the test asserts the *list* of dead lenses and not only the verdict. A count that disagrees with its own list is the shape of the original bug.
old = '''LENSES.map((lens, i) => runs[i] || deadRecord(lens.key))'''
new = '''runs.filter(Boolean)'''
kills = "tests/test_review_workflow.py::test_a_lens_that_throws_is_a_dead_lens"

[[mutant]]
name = "a lens that returned null is not listed among the dead"
file = ".claude/workflows/adversarial-review.js"
# The null-agent path - what the real incident was: agent() resolved to null and nothing recorded it.
old = '''const lensesDied = lensRecords.filter(r => r.dead).map(r => r.lens)'''
new = '''const lensesDied = lensRecords.filter(r => false).map(r => r.lens)'''
kills = "tests/test_review_workflow.py::test_a_dead_lens_is_partial_not_clean"

[[mutant]]
name = "a pass in which no lens returned reads CLEAN instead of VACUOUS"
file = ".claude/workflows/adversarial-review.js"
# VACUOUS is not a smaller CLEAN: it says nobody looked. Folding it into CLEAN is the clean bill a fan-out returned while its agents were dead (tools/review_pass_gate.py's docstring).
old = '''if (c.lensesReturned === 0) return 'VACUOUS''''
new = '''if (c.lensesReturned === 0) return 'CLEAN''''
