# Mutation battery — `.claude/workflows/adversarial-review.js`.
#
#     python3 tools/mutate.py tools/batteries/claude-workflows-adversarial-review.toml
#
# Every row is a way this review could report a pass it did not earn; the test named beside it is
# the one assertion that catches that. **A row is a claim about one assertion, never about the
# script.** The script's real fan-out cannot run in `./check.sh`; the stub hooks in
# `tests/review_workflow_harness.mjs` stand in for the runtime, so these rows prove the *control
# flow* is held - which lens starts first, what is counted before what is filtered, which model
# each call names, what is read back from a reply before it is believed, what each role's prompt
# contains - and nothing about what a real lens finds.
#
# The target is JavaScript, so `tools/mutate.py` does not compile the mutant before running it
# (its `.py`-only check) and an edit that breaks the syntax would read as a kill. Each mutant
# below was chosen to stay valid JavaScript, and the named test is the one that has to die.
#
# **How this battery got its size.** The first version had 22 rows and was fully killed. A review
# pass then wrote 62 mutants of its own, and 50 survived: the tests held less than the battery
# implied. A mutant that silently dropped a finding and read CLEAN, one removing the guard on the
# judge call, one making a high-severity finding's dismissal-on-a-guess invisible, and a dozen that
# changed what a role's prompt contained all passed. They are rows now, and the fuzz test
# (`test_no_random_scenario_breaks_an_invariant`) catches the class a hand-written row cannot.
#
# **A third pass changed the control.** Once every agent call goes through `ask()`, which catches
# a throw and returns its cause, nothing inside a lens stage can throw, so the original idiom -
# `.filter(Boolean)` over the pipeline's results - became an equivalent mutant and the first row is
# now `ask()` letting a throw through. The same pass added the rows on the role, severity, scratch
# and stop-on-a-bad-sha content of the prompts, which only a test of the prompt can pin.
#
# **Not rows, on purpose.** Removing `Array.isArray(out.findings)`, or the `not_run` type check,
# is an equivalent mutant: a non-array reaches a `.map` or `.trim()` inside the stage, which
# throws, and pipeline() drops the lens exactly as the guard would. The guards stay because the
# outcome should not depend on a TypeError.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 114

