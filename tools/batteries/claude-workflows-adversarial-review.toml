[[mutant]]
name = "CONTROL — ask() lets a throw through, so a lens or a judge that throws is no longer a recorded death with a cause"
file = ".claude/workflows/adversarial-review.js"
# The original idiom's modern form. pipeline() turns a throw into a bare null and `.filter(Boolean)` erases it; ask() catches the throw first so the death is counted and its cause kept. With the catch gone a lens still dies (pipeline absorbs the throw, and `runs[i] ||` turns it into a dead record) but the cause is lost, and a judge that throws ends the whole run. `.filter(Boolean)` on the pipeline's results is now an equivalent mutant - nothing in a stage can throw once every agent call goes through ask() - so it is not a row.
old = '''return { value: null, error: String(error && error.message || error) }'''
new = '''throw error'''
kills = [
    "tests/test_review_workflow.py::test_a_lens_that_throws_is_a_dead_lens",
    "tests/test_review_workflow.py::test_a_judge_that_throws_is_a_dead_judge_and_loses_nothing",
]

