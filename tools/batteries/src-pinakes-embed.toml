# Mutation battery — `src/pinakes/embed.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-embed.toml
#
# **One file, and one subject: what `--offline` means for the model loaders.** The fastembed ones
# first, then (second section) the sentence-transformers ones, which pass `local_files_only`
# themselves (read from the wheel and the keyword's name, not run) and lacked only the typed
# failure. Not `info()`, not the dim check in `load_backend`. A reader who greps this file and finds
# every anchor resolving has learned nothing about the rest of `embed.py`.
#
# **The subject is a promise `pnk doctor` makes — "free, offline" — that the code broke.** Measured
# 20261019 against 0.32.7: the only guard was *does the cache directory exist*, so with the embedder
# cached and the reranker not, `doctor` printed "Fetching 5 files" and grew the cache from 67 MB to
# 1.1 GB; with `HF_HUB_OFFLINE=1` it fetched nothing and died with a bare `ValueError`. Every
# mutant below is one way of putting that back.
#
# **The tests behind the first section run the real fastembed.** Two of the kills are sealed tests:
# the process may not open a socket and `model_info` / `list_repo_tree` fail loudly, so a mutant
# that reaches the network is caught by the reach, not by an assertion about a stub. The rest swap
# only fastembed's *class* for a recorder. **The second section's tests run no real library at
# all:** sentence-transformers (torch, gigabytes) is never installed for them, a stand-in module in
# `sys.modules` raises what the test says, and they therefore pin what the *loader* does with an
# exception — not which class the real package raises (its wheel was read, and the final class
# comes from transformers, which was not). None reads the real Hugging Face cache — `HF_HOME` is a
# `tmp_path` in every one. What a cached model does offline is covered for *one* provider and a
# *minimal* model: `test_a_cached_model_loads_offline_through_the_real_fastembed_exactly_as_online`
# plants a hand-encoded one-node ONNX graph and a tokenizer in a Hugging Face layout and loads
# them with the real fastembed, offline and online. The `model`-marked tests (CI, with real weights
# cached) still call the loaders with `offline=False` only, so **no test runs real weights through
# the offline path**, and none runs a sentence-transformers model at all.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 45

