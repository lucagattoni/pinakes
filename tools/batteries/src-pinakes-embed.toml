# Mutation battery — `src/pinakes/embed.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-embed.toml
#
# **One file, and one subject: what `--offline` means for the fastembed loaders.** Not the
# sentence-transformers loaders (they already pass `local_files_only` themselves), not `info()`,
# not the dim check in `load_backend`. A reader who greps this file and finds every anchor
# resolving has learned nothing about the rest of `embed.py`.
#
# **The subject is a promise `pnk doctor` makes — "free, offline" — that the code broke.** Measured
# 20261019 against 0.32.7: the only guard was *does the cache directory exist*, so with the embedder
# cached and the reranker not, `doctor` printed "Fetching 5 files" and grew the cache from 67 MB to
# 1.1 GB; with `HF_HUB_OFFLINE=1` it fetched nothing and died with a bare `ValueError`. Every
# mutant below is one way of putting that back.
#
# **The tests behind these rows run the real fastembed.** Two of the kills are sealed tests: the
# process may not open a socket and `model_info` / `list_repo_tree` fail loudly, so a mutant that
# reaches the network is caught by the reach, not by an assertion about a stub. The rest swap only
# fastembed's *class* for a recorder. None reads the real Hugging Face cache — `HF_HOME` is a
# `tmp_path` in every one — and none can say what a *real* cached model does offline, which only
# the `model`-marked tests (CI, with the weights cached) can.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 19

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20261030 · offline means the cache holds this model, or the load fails typed
# ────────────────────────────────────────────────────────────────────────────────────────────────

