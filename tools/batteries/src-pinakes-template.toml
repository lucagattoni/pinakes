# Mutation battery — `src/pinakes/template.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-template.toml
#
# **`template.py` had no battery at all** until 20260902. It is the file that writes the first byte
# of every KB, and S4 is what happens when nobody is watching it: a name carrying a `"` produced a
# `pinakes.toml` no parser could read, while `pnk init` exited 0 and printed *created*.
#
# **The organising idea of these rows: parsing is the weaker claim** — and this file's own first
# draft got that wrong in the direction it was warning about, which is why the correction is kept
# here rather than tidied away. It claimed that dropping the backslash arm leaves `C:\notes\kb`
# **valid TOML** reading back as `C:` + newline + `otes\kb`. **Measured: false.** That value also
# holds `\k`, which TOML does not define, so the file is *rejected* and the mutant dies on a
# `TOMLDecodeError` — a parse failure, not an equality failure.
#
# The claim is true of a *different* value. `C:\notes` alone contains only `\n`, which is legal, so
# without escaping it parses cleanly and means `C:`, a newline, `otes`. That case reached no test
# until the mutation run exposed it, and *a backslash is left raw, so a Windows-style path parses as a name nobody typed*
# now kills through
# `test_a_backslash_path_that_stays_valid_toml_still_reads_back_unchanged` rather than through the
# eleven-value corpus — so the row asserts *round-trips*, which is what its name claims, instead
# of passing on *parses*, which is the weaker property it was accidentally resting on.
#
# **Four of the tests these rows kill through are controls that pass without the fix**, so they can
# only ever kill an *over*-escaping mutant — the two under the second heading, *the tab exemption is
# dropped* and *the non-string guard quotes*, are the pair that aim at them. A battery made only of
# under-escaping mutants would leave the whole over-escaping direction unmeasured, and over-escaping
# is the direction the obvious fix actually fails in.
#
# **Rows are named, not numbered, in this header on purpose.** An earlier draft said *rows 4 and 5*
# and *row 5* when the file's order made them 5, 6 and 6 — an off-by-one from inserting a row
# without renumbering the prose, and the second self-referential slip this file has had to correct.
# A name survives an insertion; an ordinal does not.
#
# **The seam, named rather than discovered later.** `finalize` is handed the value of every
# interpolation, and Jinja calls `str()` on whatever comes back — so a mutant that merely
# *stringifies* a non-string is invisible by construction: `dim = {{ embedding_dim }}` renders
# `dim = 384` whether the hook returned `384` or `"384"`. *The non-string guard quotes* therefore
# mutates the guard into one that **quotes**, which is observable, rather than one that stringifies,
# which is not. A row written against the stringifying edit would be a guaranteed survivor dressed
# as a coverage finding.
#
# **Three rows in this increment killed for the wrong reason, and that is a pattern, not a run of
# bad luck.** *A backslash is left raw* died on a `TOMLDecodeError` where its name claimed an
# equality. *The refusal echoes the value* died on the wording `U+DCFF` while both anti-echo
# assertions stayed green, because `repr` escapes a surrogate and an ESC by construction — the
# mutant was a terminal-**safe** echo. And *the surrogate arm is removed* kills through
# `UnicodeEncodeError`, which `pytest.raises(TemplateError)` does not catch, so the
# `assert not root.exists()` on the line below it **never runs** — the ordering row now in
# `src-pinakes-init.toml` exists because no edit to *this* file can reach that assertion.
#
# The common shape: **a mutant that dies on the wrong assertion reports exactly like one that dies
# on the right one**, and the load-bearing half of the test is left unmeasured underneath a green
# count. **`tools/mutate.py` does print the failing assertion** — on the per-mutant line, above
# the summary. What it does not do is put it in the table, and the table is what gets read and
# quoted: `| <row name> | KILLED | <test id> |` carries the row's own claim about itself and no
# evidence for it. All three were found by reading the line above the table. Three instances in one
# increment is the argument for moving the reason into it, and that is rowed rather than done here.
#
# (An earlier draft of this paragraph said mutate.py prints no kill reason at all. It does; the run
# on 20260903 printed `AssertionError: assert '\udcff' not in ...` for the row below. Corrected in
# the same increment that wrote it, which is the fourth claim here asserted before it was run.)
#
# **What no row here reaches:** that `render_manifest` and `render_archived` escape *identically*.
# Both call `_render`, so no single-line edit can separate them —
# `test_both_sides_of_an_upgrade_diff_escape_identically` pins the property, and nothing in this
# file can kill through it. That is a seam, not a gap.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 10

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260902 · a value a user typed cannot change what the manifest MEANS
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# The four under-escaping rows. Each removes one class of escape and leaves the rest, because
# removing them all is one mutant that every test kills and says nothing about which test carries
# which class.

[[mutant]]
name = "the escaping hook is never installed, so every interpolation goes out raw again"
file = "src/pinakes/template.py"
old = "            finalize=_toml_basic,"
new = "            finalize=None,"
kills = "tests/test_template.py::test_init_writes_a_kb_that_load_can_open_whatever_the_name_holds"

[[mutant]]
name = "a double quote is left raw, so the name closes the string it is written inside"
file = "src/pinakes/template.py"
old = '''    '"': '\\"',
'''
new = ""
kills = "tests/test_template.py::test_a_name_in_any_class_the_sweep_named_renders_a_manifest_that_parses"

# **The row that distinguishes parsing from meaning**, and the only one whose `kills` deliberately
# names a single-value test rather than the corpus. `C:\notes` is syntactically fine without any
# escaping — `\n` is a legal TOML escape — so it parses and means `C:`, a newline, `otes`, and a
# KB reports healthy under a name nobody typed. Pointed at the eleven-value corpus this row
# died on `\k` being an illegal escape instead, which is the mutant passing for the wrong reason.
[[mutant]]
name = "a backslash is left raw, so a Windows-style path parses as a name nobody typed"
file = "src/pinakes/template.py"
old = '''    "\\": "\\\\",
'''
new = ""
kills = "tests/test_template.py::test_a_backslash_path_that_stays_valid_toml_still_reads_back_unchanged"

[[mutant]]
name = "a control character with no single-letter escape is emitted raw instead of as \\uXXXX"
file = "src/pinakes/template.py"
old = '        elif character != "\t" and (character < " " or character == "\x7f"):'
new = '        elif False:'
kills = "tests/test_template.py::test_init_writes_a_kb_that_load_can_open_whatever_the_name_holds"

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260902 · and escaping does not rewrite what was already correct
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# The over-escaping direction, which the four control tests exist for. Both rows below produce a
# manifest that parses cleanly — neither can be caught by asking whether the output is valid TOML.

# Tab is the one control character a TOML basic string may carry raw. This mutant escapes it like
# every other, which round-trips perfectly — `tomllib` unescapes `\t` back to a tab — so the ONLY
# instrument that can see it is an assertion on the byte on disk. That is why the control test reads
# the written file rather than re-parsing it.
[[mutant]]
name = "the tab exemption is dropped, rewriting a legal byte that needed no escape"
file = "src/pinakes/template.py"
old = '        elif character != "\t" and (character < " " or character == "\x7f"):'
new = '        elif character < " " or character == "\x7f":'
kills = "tests/test_template.py::test_a_tab_is_left_raw_rather_than_escaped"

# **Not the stringifying edit** — see the seam note in this file's header: `str(384)` is invisible
# because Jinja stringifies anyway. Quoting is the observable form of the same mistake, and it is
# the one that turns `dim = 384` into `dim = "384"` — valid TOML that `manifest.load` then rejects
# far from `init`, in a command with nothing to do with creating the KB.
[[mutant]]
name = "the non-string guard quotes what it passes through, so the bare dimension becomes a string"
file = "src/pinakes/template.py"
old = """    if isinstance(value, int):
        return value"""
new = """    if isinstance(value, int):
        return f'"{value}"'"""
kills = "tests/test_template.py::test_the_embedding_dimension_stays_a_bare_integer"

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260902 · and a value TOML cannot represent is refused before anything is created
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Added by an adversarial review's second pass, which found the arm the first six rows had no
# reason to look at: **not every value can be escaped.** A lone surrogate (U+D800-U+DFFF) has no
# TOML form raw or escaped, and POSIX hands one over routinely — `surrogateescape` is what an
# invalid UTF-8 byte in `sys.argv` or a directory name becomes. Unescaped it reached
# `Path.write_text`, which creates and truncates *before* the encoder raises: a zero-byte
# `pinakes.toml` and a directory `init` then refuses as *already a KB*. **S4's own end state,
# reproduced by S4's own fix**, which is why these rows exist rather than a note.
#
# The same review found the guard was a deny-list — *not a `str`* — so anything that was not one
# went out untouched, and Jinja stringifies whatever `finalize` returns. Two of the rows below
# aim at the allow-list that replaced it.

[[mutant]]
name = "the surrogate arm is removed, so an unrepresentable value reaches Path.write_text again"
file = "src/pinakes/template.py"
old = "        elif \"\\ud800\" <= character <= \"\\udfff\":"
new = '        elif False:'
kills = "tests/test_template.py::test_a_name_holding_an_unpaired_surrogate_is_refused_before_anything_is_created"

# The refusal message is printed to a terminal, and the value that triggered it is by definition
# one nobody can print safely — a name carrying an unpaired surrogate can carry an ANSI escape
# beside it. This mutant is the obvious "helpful" edit: show the user what they typed.
#
# **This row killed for the wrong reason until 20260903, and the wrong reason was `repr`.** It
# used to substitute `{text!r}`, which escapes a surrogate and an ESC *by construction* — so the
# mutant was a terminal-**safe** echo, the two anti-echo assertions stayed green, and the kill
# came from the third: the words `U+DCFF` going missing. Measured:
#
#     assertion                    {text!r}    U+... in {text}
#     "U+DCFF" in message          False       True
#     "\udcff" not in message       True        False
#     "\x1b" not in message         True        False
#
# The mutant now keeps the code point and adds the raw value beside it, so the kill is carried
# by the property the row is named for instead of by its wording. **A row that dies on the wrong
# assertion reports exactly like one that dies on the right one** — this is the second instance
# in this battery, after *a backslash is left raw*, and the two together are why the kill reason
# belongs in `tools/mutate.py`'s summary table rather than only on the line above it.
[[mutant]]
name = "the refusal echoes the value it is refusing, straight to the terminal"
file = "src/pinakes/template.py"
old = '                f"a value for this manifest holds U+{ord(character):04X}, an unpaired surrogate, "'
new = '                f"a value for this manifest holds U+{ord(character):04X} in {text}, an unpaired surrogate, "'
kills = "tests/test_template.py::test_the_refusal_names_the_code_point_and_never_echoes_the_value"

# **The regression this whole section exists for.** Reverting the allow-list to the deny-list it
# replaced is a one-line edit that looks like a simplification and reopens S4 for every value that
# is not already a `str`.
[[mutant]]
name = "the allow-list reverts to the deny-list, so a non-string goes out unescaped again"
file = "src/pinakes/template.py"
old = '    if isinstance(value, int):'
new = '    if not isinstance(value, str):'
kills = "tests/test_template.py::test_a_context_value_that_is_not_a_string_is_escaped_rather_than_passed_through"

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260903 · four lines that changed nothing a parser could see
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# `\b`, `\f`, `\n` and `\r` have single-letter TOML escapes *and* fall under the `\uXXXX` fallback,
# which shadows all four: drop one and the manifest still parses, and still round-trips the exact
# value. Every round-trip test in the file stays green. **They were unobservable** — the same
# standard that deleted the `bool` exclusion from this increment, arriving from a review pass
# instead of from its author.
#
# The row below kills through the bytes on disk, which is the only instrument that separates
# `name = "a\nb"` from `name = "a\u000ab"`. One of the four is enough: they share a mechanism, and
# four near-identical rows would be four claims about one line.

[[mutant]]
name = "the newline loses its single-letter escape, so a manifest a human opens carries a code point"
file = "src/pinakes/template.py"
old = '''    "\n": "\\n",
'''
new = ""
kills = "tests/test_template.py::test_the_four_reserved_escapes_are_written_as_letters_not_code_points"
