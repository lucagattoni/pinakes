[[mutant]]
name = "the marker loosens to a bare glyph, so the only checkable part becomes optional"
file = "tools/status_header_gate.py"
# A reader sees a pause glyph either way, and so does anything that greps for the character. What
# is lost is the qualifier — the span that carries the claim about the index.
old = '''HOLD = re.compile(r"⏸\s*\*\*(?P<why>[^*]+)\*\*")'''
new = '''HOLD = re.compile(r"(?P<why>⏸)")'''
kills = "tests/test_status_header_gate.py::test_the_marker_must_be_a_parsed_shape_not_a_loose_glyph"

[[mutant]]
name = "layer 1's failure loses the phrase ci.yml greps, leaving the negative check on exit code alone"
file = "tools/status_header_gate.py"
# A coupling across three files: this string, `ci.yml`'s `grep -q`, and the `tests/test_check_script.py`
# pin that holds the grep as a command. `ci.yml`'s own comment says a bare non-zero exit is
# insufficient because a crash satisfies it — so reworded here alone, that step stops distinguishing
# a gating failure from a broken tool.
old = '''            f"{stated}, but pinakes.__version__ is {expected} — the header drifted from the "'''
new = '''            f"{stated}, but pinakes.__version__ is {expected} — the header disagrees with the "'''
kills = "tests/test_status_header_gate.py::test_layer_one_runs_first_so_the_ci_negative_check_still_reads_its_reason"

[[mutant]]
name = "PUBLISHED_ROW points at the PROSE sequence forty lines away — and the real tree stays green"
file = "tools/status_header_gate.py"
# **The mutant to read twice.** `release_order_gate.py` has two sequences over `docs/STATUS.md`, and
