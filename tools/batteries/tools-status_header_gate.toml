old = '''    if _show(newest) not in marker.group("why"):'''
new = '''    if False:'''
kills = "tests/test_status_header_gate.py::test_a_hold_marker_naming_the_wrong_published_version_fails"

[[mutant]]
name = "R becomes the row's OLDEST entry rather than its newest"
