# Mutation battery — `tools/status_header_gate.py`.
#
#     python3 tools/mutate.py tools/batteries/tools-status_header_gate.toml
#
# Every row is a way this gate could be wrong while still printing a green run; the test named
# beside it is the one assertion that catches that.
#
# **This target had no battery until 20260826**, which `plans/20260825_0749-exposure-and-silent-status.md`
# named as a residual before the build rather than after it. Most of the rows below are layer 2 —
# the hold marker — because layer 2 exists precisely to catch a state that is *green by
# construction* everywhere else in this repository, and a check like that is exactly the kind that
# can be deleted without any other gate noticing.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 12

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260826 · D-35 layer 2 — the hold marker, against the *Published versions* row
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# Mutant 1 is the control: a known-catchable change on the layer that already existed, run first,
# because a battery with no kills is a broken harness rather than a clean bill.

[[mutant]]
name = "CONTROL — layer 1 compares the stated version to itself"
file = "tools/status_header_gate.py"
old = '''    if stated != expected:'''
new = '''    if stated != stated:'''
kills = "tests/test_status_header_gate.py::test_disagreeing_versions_fail_naming_both"

[[mutant]]
name = "layer 2 is never called, and the gate reports on layer 1 alone as it did before D-35"
file = "tools/status_header_gate.py"
# The whole increment, removed in one line, with a success message that still reads correctly
# because it is layer 1's. This is the shape a careless revert takes.
old = '''    layer_two = _check_hold_marker(status_file, text, tail, _parse(stated))'''
new = '''    layer_two = 0'''
kills = "tests/test_status_header_gate.py::test_a_landed_but_unpublished_version_requires_the_hold_marker"

[[mutant]]
name = "an unreadable *Published versions* row becomes a skip instead of a hard failure"
file = "tools/status_header_gate.py"
# `return 0` in front of the refusal, not `if False:` — removing the branch entirely would crash on
# `published[-1]`, and a mutant killed by an IndexError is a claim about a broken tool rather than
# about the property. The decision is explicit that this case is a hard failure and never a skip;
# a skip would disarm the marker rule from a commit touching neither this file nor STATUS.md.
old = '''    if not published:
        return _fail('''
new = '''    if not published:
        return 0
        return _fail('''
kills = "tests/test_status_header_gate.py::test_a_row_the_gate_cannot_read_is_a_hard_failure_never_a_skip"

[[mutant]]
name = "a second row that looks like the row is swallowed, and layer 2 reads whichever sorted first"
file = "tools/status_header_gate.py"
# `release_order_gate.py` refuses an ambiguous `within` rather than resolving it to the first
# match, and that refusal has to reach *this* gate as a failure. Caught here, not there.
old = '''    except AmbiguousRegionError as exc:
        return _fail('''
new = '''    except AmbiguousRegionError as exc:
        return 0
        return _fail('''
kills = "tests/test_status_header_gate.py::test_a_second_published_versions_row_fails_rather_than_reading_the_first"

[[mutant]]
name = "a published version may keep the marker — the exact state nothing else can see"
file = "tools/status_header_gate.py"
# The single most valuable row in this battery. X7's index rule is *unqualified + absent → red*, so
# a stale marker after a successful publish is green there by construction, forever; `SHAPE` stops
# at the closing `**`; no release-order sequence reads line 3's tail. Delete this branch and a
# false headline stands indefinitely with every gate in the repository green.
old = '''        if marker is not None:'''
new = '''        if False:'''
kills = "tests/test_status_header_gate.py::test_a_published_version_may_not_keep_the_hold_marker"

[[mutant]]
name = "a landed-but-unpublished version no longer needs the marker"
file = "tools/status_header_gate.py"
old = '''    if marker is None:
        return _fail('''
new = '''    if marker is None:
        return 0
        return _fail('''
kills = "tests/test_status_header_gate.py::test_a_landed_but_unpublished_version_requires_the_hold_marker"

[[mutant]]
name = "the marker's qualifier stops having to name what `pip install` actually gets"
