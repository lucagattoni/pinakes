# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260903 · the refusal is only worth anything because of where it sits
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# S4's fix refuses a value TOML cannot represent — an unpaired surrogate, which POSIX makes of any
# invalid UTF-8 byte in an argument or a directory name. **The refusal matters because
# `render_manifest` runs before `root.mkdir`**: raise there and nothing has been created, so a
# retry with a good name works. Raise after, and the user has a directory `init` refuses as
# *already a KB* — which is S4's own end state.
#
# `test_a_name_holding_an_unpaired_surrogate_is_refused_before_anything_is_created` asserts both
# halves, and **its `assert not root.exists()` was unreachable by any mutant until 20260903.** The
# template battery's *the surrogate arm is removed* row kills it, but through the wrong door: with
# the arm gone the refusal never fires at all, `write_text` raises `UnicodeEncodeError`,
# `pytest.raises(TemplateError)` does not catch it, and the test dies before it reaches the
# `exists()` line. Measured on this branch — `root.exists()` True, `pinakes.toml` 0 bytes.
#
# So the row belongs here, against the **ordering**, where it can fire.

[[mutant]]
name = "the KB directory is created before the manifest is rendered, so a refused name leaves it behind"
file = "src/pinakes/init.py"
old = """    rendered = template.render_manifest("""
new = """    root.mkdir(parents=True, exist_ok=True)
    rendered = template.render_manifest("""
kills = "tests/test_template.py::test_a_name_holding_an_unpaired_surrogate_is_refused_before_anything_is_created"

# ────────────────────────────────────────────────────────────────────────────────────────────────
# unreleased, 20260903 · S8 and S9 — one missing boundary check, seen from two ends
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# **These rows are about `src/pinakes/cli.py`, in a battery named for `init.py`, and that is the
# convention rather than an accident.** `tools/batteries/README.md` § *Named for is not covers*:
# one battery per file, not per subject, and `cli.py` was already claimed here by the
# `.gitignore`-warning rows above. A second file would be refused by
# `tests/test_batteries.py::test_no_file_is_claimed_by_two_batteries`, and the same shape was
# already refused once on 20260831 for `src-pinakes-serve.toml`.
#
# `-k` was `type=int` and nothing more, so the value flowed to whatever the command reached and
# each surface failed in its own way. `search` reached `passages[:final_k]`, where a negative
# width is a legal Python slice bound: `-k -1` answered with every passage but the last at exit 0,
# `-k -100` answered "no passages matched." `ask` reached `deep/estimate.py:_positive` and raised
# an unhandled `ValueError` traceback. **The confident wrong answer is the worse half**, and it is
# the half no traceback would have brought anyone to.
#
# The rows below are all about *where* the check sits. A guard on either arm alone would leave the
# other wrong, and both arms are downstream of one flag that a shared `_retrieval_arguments`
# declares once.

[[mutant]]
name = "THE SHIPPED DEFECT — -k goes back to a bare int, so a negative width is a slice bound again"
file = "src/pinakes/cli.py"
# The whole of S8 and S9. Both commands regress together because the declaration is shared, which
# is the point: the parametrised selector fails on `search` and on `ask`, and a fix applied to
# only the arm that crashed would leave the arm that answered wrongly still answering wrongly.
old = '''    parser.add_argument("-k", type=_passage_count, default=None, help="how many passages to return")'''
new = '''    parser.add_argument("-k", type=int, default=None, help="how many passages to return")'''
