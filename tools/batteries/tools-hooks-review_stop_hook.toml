# Mutation battery — `tools/hooks/review_stop_hook.py`, and the `.claude/settings.json` that wires it.
#
#     python3 tools/mutate.py tools/batteries/tools-hooks-review_stop_hook.toml
#
# Every row is a way this hook could let a turn end over a fan-out that lost agents, or trap a turn
# it should have let go, while every other test stayed green. **A row is a claim about one
# assertion, never about the script**: the named test is the one that has to die, and nothing here
# says what a real Stop payload looks like — the hook has not fired live yet (the payload is built
# from the hooks reference, and a hook added to `settings.json` does not take effect in the session
# that added it).
#
# The settings rows share this battery on purpose: `.claude/settings.json` is a file with one
# consumer, and a second battery for it would make two files for one increment to maintain
# (`tools/batteries/README.md`). The command in it carries three properties that each fail
# silently — it must follow the working directory and not `${CLAUDE_PROJECT_DIR}`, and it must
# exit 0 where the script is absent, because `python3` on a missing script exits 2 and 2 blocks.
#
# **Not rows, on purpose.** Dropping `sorted(...)` in `session_runs` reorders the message and
# nothing else; a glob widened from `wf_*` to `*` changes nothing the tests can tell apart until a
# real run directory shows what else lives beside a journal; the `bool` guard in `_int` and the
# `exit 3` branch's wording are equivalent to the crash path they sit beside (both reach exit 1 with
# the run named). A survivor among them would be a finding about the tests, not about the hook.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 31

# ────────────────────────────────────────────────────────
# unreleased, 20261019 · a Stop hook that will not let a turn end over a lost fan-out
