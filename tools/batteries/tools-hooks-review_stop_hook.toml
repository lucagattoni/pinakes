# Mutation battery — `tools/hooks/review_stop_hook.py`, and the `.claude/settings.json` that wires it.
#
#     python3 tools/mutate.py tools/batteries/tools-hooks-review_stop_hook.toml
#
# Every row is a way this hook could let a turn end over a fan-out that lost agents, or trap a turn
# it should have let go, while every other test stayed green. **A row is a claim about one
# assertion, never about the script**: the named test is the one that has to die, and nothing here
# says what a real Stop payload looks like — the hook fired live once, 20261019 09:24 UTC, and the
# payload is still built from the hooks reference (the session that created `settings.json` had
# not picked it up; a fresh worktree session ran the primary checkout's copy).
#
# The settings rows share this battery on purpose: `.claude/settings.json` is a file with one
# consumer, and a second battery for it would make two files for one increment to maintain
# (`tools/batteries/README.md`). The command in it carries three properties that each fail
# silently — it must follow the working directory and not `${CLAUDE_PROJECT_DIR}`, and it must
# exit 0 quietly where the script is absent (`python3` on a missing script exits 2, which the hooks
# reference makes a block unless the stderr says a file is missing - not a special case to lean on).
#
# **Not rows, on purpose.** Dropping `sorted(...)` in `session_runs` reorders the message and
# nothing else; a glob widened from `wf_*` to `*` changes nothing the tests can tell apart (the
# first live review measured 118 real run directories: every journal sits in a `wf_*` directory,
# beside only `agent-*` files), and the `exit 3` branch's wording is equivalent to the crash path
# it sits beside (both reach exit 1 with the run named). **The `bool` guard in `_int` was on this
# list until the first live review pass showed the claim false** - without it a gate printing
# `true` for a count turns a crash into a block carrying a nonsense number - and it is a row now.
# A survivor among the ones still listed would be a finding about the tests, not about the hook.
#
# **How this battery got its size.** The first draft had 31 rows, all killed. The first live review
# pass (the D3 smoke run, 20261019) then wrote its own mutants and seven survived: the `exec` in the
# settings command, the UTC stamp, a path quoted three ways in the printed command, the guard on a
# non-string `transcript_path`, and the exit status of "cannot be judged yet". They are rows now,
# beside the ones the review's other findings (a per-run failure hiding a neighbour, a digest to
# cover a resume, a placeholder accepted as an acknowledgement) added. A second reviewer then wrote
# 82 mutants of its own against the result and 28 genuine ones survived, which is why the rows at
# the end exist. A fully killed battery measures the mutants its author thought of.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 73

