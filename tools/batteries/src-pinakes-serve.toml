# Mutation battery — `src/pinakes/serve.py`.
#
#     python3 tools/mutate.py tools/batteries/src-pinakes-serve.toml
#
# **The identity a request is answered under.** `ServedKb` used to cache one `sqlite3.Connection`
# per KB and hand it to whichever thread asked next. `serve.py` starts no threads, so the file
# reads as single-threaded and every test in `tests/test_serve.py` encoded that reading — none of
# them started a thread. The MCP transport supplies them: a sync tool runs under
# `anyio.to_thread.run_sync`, on a pooled worker retired after ten idle seconds (S3).
#
# **What was measured, because the obvious framing was wrong.** Driven end to end through
# `mcp.call_tool`, six concurrent calls left two answering and four raising `ProgrammingError`,
# while an eleven-second pause did *not* reproduce the query failure at all — macOS had already
# handed the retired worker's thread id to its replacement, and `sqlite3` compares ids. The symptom
# that reproduced on every attempt was `close()`, which runs on a thread that opened nothing.
#
# **The row this battery cannot have.** The keying mistake the fix exists to avoid — keying the
# cache by `threading.get_ident()` rather than by the thread object — has no mutant here, because
# no test kills it deterministically. A recycled id makes a dead entry look alive and hands a new
# thread a dead one's handle, and whether the id is recycled is the OS's choice, not the test's.
# It is stated here rather than given a row with a `kills` selector it would not honour: that
# failure mode is recorded in `tests/test_serve.py`'s docstrings and in the fix's own, and a
# battery row that names a test which cannot kill it would be worth less than this paragraph.
# It is also not hypothetical — it is what the first draft of the rebuild test did, and that test
# passed against the unfixed code.
#
# No `pytest` key: a committed battery takes the default, `uv run --frozen pytest`.

mutants = 5

